server:
  port: 8080

spring:
  application:
    name: pfc-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:pfc_db}
    username: ${POSTGRES_USER:pfc_user}
    password: ${POSTGRES_PASSWORD:pfc_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}

app:
  cookie:
    # Secure=true por defecto (produccion sobre HTTPS). Solo se debe overridear a false
    # via COOKIE_SECURE en el .env de desarrollo local (docker-compose sobre HTTP plano).
    secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# JSON crudo de OpenAPI queda en el path por defecto de springdoc (/v3/api-docs):
# ni el PDF de la guia ni el enunciado del SGA exigen un path especifico para el JSON,
# solo para la UI interactiva (swagger-ui.path). Ver DocsRedirectController para el
# alias /api/docs -> /api/documentation que cumple la letra del SGA.
springdoc:
  swagger-ui:
    path: /api/documentation
