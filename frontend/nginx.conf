# Nginx interno del container "frontend": solo sirve los estaticos de Angular con
# fallback de SPA routing. No confundir con nginx/nginx.conf (el reverse proxy de entrada).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
